[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcschema"
version = "1"
description = "A schema for quantum chemistry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "pathlib2; python_version < '3.5'",
]

[project.optional-dependencies]
docs = [
    "sphinx==1.2.3",
    "sphinxcontrib-napoleon",
    "sphinx_rtd_theme",
    "numpydoc",
]
tests = [
    "pytest",
    "qcelemental",
    "qcmanybody",
]

[project.urls]
Homepage = "https://github.com/MolSSI/QCSchema"

[tool.setuptools]
packages = ["qcschema"]
zip-safe = true

[tool.setuptools.package-data]
"qcschema" = ["**/*.schema"]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
lint.ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["qcschema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Note: If you encounter "ModuleNotFoundError: No module named 'qcelemental.models._v1v2'"
# from a pytest plugin, it means an external package has a pytest11 entry point that fails.
# Run with: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. pytest tests/
# See tests/conftest.py for more information.
